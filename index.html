<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management App</title>
    <script src="script.js" defer></script>
</head>
<body>
    <main>
         
        <section>
            <h1>Task Management</h1>

           <div>
                
                <input  id="task" type="text" placeholder="Task"/> 
                
                
               <label for="category">Status:
                    <select name="" id="category">Category
                        <option value="">-Select-</option>
                        <option value="Work">Work</option>
                        <option value="home">Home</option>
                        <option value="school">School</option>
                    </select>
                </label>


                <label for="duedate">Deadline:
                    <input type="date" id="dueDate" value="2018-07-22"/> 
                </label>
                

                <label for="status">Status:
                    <select name="" id="status">
                        <option value="">-Select-</option>
                        <option value="Not-Started">Not-Started</option>
                        <option value="InProgress">InProgress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </label>

                <button id="add">Add Task</button>
            

                <label for="filter">Filter by:
                <input  id="filter" type="text" placeholder=""/> 
                </label>

            </div> 
         
        </section>

    

    </main>
    
</body>
</html>
